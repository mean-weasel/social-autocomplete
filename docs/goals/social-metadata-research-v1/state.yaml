version: 2

goal:
  title: "Implement Browser-First Social Metadata Research v1"
  slug: "social-metadata-research-v1"
  kind: existing_plan
  tranche: "Continuously implement and verify the complete approved v1 through release proof."
  status: active
  oracle:
    signal: "Clean-checkout release verification, cross-host install and fixture parity, subprocess JSON consumption, and current browser-acceptance receipts prove the approved v1 works."
    cadence: "after each Worker package and at final audit"
    final_proof: "npm run verify:release passes; Codex and Claude clean-install and parity checks pass; subprocess JSON demo passes; required browser-acceptance receipts exist and pass."
  intake:
    original_request: "Make a detailed implementation plan using GoalBuddy Prep based on the approved spec."
    interpreted_outcome: "Deliver the complete approved browser-first social metadata research v1 with an executable CLI, equal Codex and Claude plugins, live channel playbooks, and receipt-backed release proof."
    input_shape: existing_plan
    audience: "Codex and Claude users plus subprocess integrations such as Lineage"
    authority: approved
    proof_type: demo
    completion_proof: "A clean checkout passes release verification and host, subprocess, fixture, and browser acceptance demonstrate the full approved outcome."
    likely_misfire: "Passing contract and fixture tests while real host/browser workflows remain unproven or evidence semantics are weakened."
    blind_spots_considered:
      - "Current Codex and Claude plugin packaging and browser capability differences."
      - "Authenticated acceptance availability and platform UI drift."
      - "Private evidence sanitization and project-local Git exclusion."
      - "The repository has no existing implementation tooling."
    existing_plan_facts:
      - "Approved design: docs/superpowers/specs/2026-07-27-social-metadata-research-design.md"
      - "One TypeScript package with internal boundaries and first-class Codex and Claude packaging."
      - "Public CLI commands: plan, record-observation, validate."
      - "V1 modules: search-term and hashtag; Pinterest hashtag is not_applicable."
      - "Guided and automatic orchestration; autocomplete_only and results_sample evidence tiers."
      - "Seven channel playbooks with visible resumable authentication and UI-change interruptions."
      - "No publishing, composer interaction, scraping, Buffer/GrowthOps dependency, or required provider API."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/social-metadata-research-v1/"
    command: "node /Users/neonwatty/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.1/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/social-metadata-research-v1"

