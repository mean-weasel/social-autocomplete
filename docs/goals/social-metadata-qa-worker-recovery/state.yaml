        - "The observed run preserved runId qa_20260729T162038Z, Chrome, ordered channels [instagram,facebook,linkedin], contiguous sequences 1-7, and one completed Instagram result."
        - "Facebook channel_begin sequence 6 had a persisted response hash before host failure; therefore safe recovery must not resend or reauthorize that accepted browser action unless the checkpoint proves it was never accepted."
