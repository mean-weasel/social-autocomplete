      rationale: "The existing binding gate is correct, but browser_action_started is still a one-phase declaration: an agent can emit a malformed envelope and begin browser work before the manager reducer accepts it. Make it a fail-closed two-phase start. The worker first emits the exact hashed start intent; the manager persists it as start_persisted, advances it conservatively to started before sending one exact QA_CHECKPOINT_ACK, and the worker may call Chrome only after receiving that matching acknowledgement. Missing or mismatched hashes therefore cannot start browser work. Any failure after the acknowledgement transition remains ambiguous and non-replayable. Predeclare one 60000 ms operation timeout in the hashed descriptor and forbid retry."
      checkpoint_contract:
        worker_event: "QA_EVENT browser_action_started must contain channel, browser, action, actionHash, and timeoutMs:60000."
        manager_persist: "start_browser_action changes action.state from binding_verified to start_persisted."
        manager_ack: "After persisting start_persisted, the manager applies authorize_browser_action_start with the same channel/actionHash, moving state to started before sending one QA_CHECKPOINT_ACK."
        worker_gate: "The worker begins the Chrome operation only after an exact matching QA_CHECKPOINT_ACK. Manager prose is never sufficient."
        recovery: "A host boundary at start_persisted is retry-safe only by invalidating the binding and returning to authorized; a boundary at started remains ambiguous and terminal."
        timeout: "The hashed action descriptor fixes timeoutMs at 60000; timeout or failure after acknowledgement is terminal and never retried."
