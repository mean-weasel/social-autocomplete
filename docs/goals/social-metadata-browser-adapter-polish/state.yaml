version: 2

goal:
  title: "Social Metadata Browser Adapter Polish"
  slug: "social-metadata-browser-adapter-polish"
  kind: specific
  tranche: "Map, implement, and prove current authenticated Chrome search-entry adapters for Instagram, Facebook, and LinkedIn."
  status: blocked
  oracle:
    signal: "Fresh sanitized Chrome receipts plus fixtures and release verification prove current native search-entry recognition and bounded autocomplete evidence without weakening privacy or evidence rules."
    cadence: "after the implementation package and at final live audit"
    final_proof: "A fresh one-time-authorized Instagram→Facebook→LinkedIn run plus final Judge mapping records full_outcome_complete: true."
  intake:
    original_request: "Plan the next browser-adapter polish round and rerun the same three-channel QA scenario."
    interpreted_outcome: "Instagram, Facebook, and LinkedIn reach their current native search surfaces safely and produce validated bounded autocomplete evidence."
    input_shape: specific
    audience: "Codex and Claude users of browser-first social metadata research"
    authority: requested
    proof_type: demo
    completion_proof: "Current live Chrome evidence for both modules on the selected three channels, or an exact truthful external blocker that does not weaken the contract."
    likely_misfire: "Suppressing ui_change with permissive landmark logic instead of recognizing the real native search surface safely."
    blind_spots_considered:
      - "Responsive and account-specific authenticated layouts"
      - "Route changes and search controls revealed only after bounded navigation"
      - "Target acquisition without broad tab enumeration"
      - "Locale drift and native-empty confusion"
      - "Platform-side autocomplete unavailability"
    existing_plan_facts:
      - "Selected order is Instagram, Facebook, LinkedIn."
      - "Authenticated work uses the existing visible Chrome profile."
      - "Hashtag and search-term modules use autocomplete_only evidence."
      - "One-time authorization is required immediately before live browser work."
      - "Manager-owned recovery and stable CLI/JSON contracts remain unchanged."
      - "Claude testing and CI are deferred."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

