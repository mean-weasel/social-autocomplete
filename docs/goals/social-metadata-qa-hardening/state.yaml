version: 2

goal:
  title: "Social Metadata QA Hardening"
  slug: "social-metadata-qa-hardening"
  kind: existing_plan
  tranche: "Implement and prove the corrected local-QA findings."
  status: active
  oracle:
    signal: "Clean release verification plus fresh isolated Codex QA proves explicit run selections, sanitized browser inspection, and truthful LinkedIn/Pinterest behavior."
    cadence: "after each Worker package and at final audit"
    final_proof: "Focused receipts, passing release verification, clean-install proof, and a corrected fresh QA receipt mapped to every finding."
  intake:
    original_request: "Make a detailed plan using GoalBuddy Prep to implement the corrected QA findings."
    interpreted_outcome: "Turn the corrected QA findings into verified plugin and QA hardening without implementing during prep."
    input_shape: existing_plan
    audience: "Codex users and local QA maintainers"
    authority: approved
    proof_type: test
    completion_proof: "The goal oracle passes and final audit records full_outcome_complete: true."
    likely_misfire: "Passing tests after wording-only changes while live UX, browser privacy, or channel entry behavior remains broken."
    blind_spots_considered:
      - "Codex top-level skill catalog limits"
      - "Authenticated LinkedIn responsive variants"
      - "Pinterest business-account redirects"
      - "Transient browser-read privacy"
      - "Separation of QA and source repositories"
    existing_plan_facts:
      - "New runs must explicitly ask for and record an ordered channel list; resume reuses only the same run."
      - "LinkedIn authenticated search landmarks did not match the current feed UI."
      - "Pinterest business accounts may redirect through Business Hub without the expected search landmark."
      - "X, TikTok, and YouTube are packaged but not independently top-level discoverable; orchestrated use still works."
      - "Future authenticated QA must prohibit broad tab listings and full DOM snapshots."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

