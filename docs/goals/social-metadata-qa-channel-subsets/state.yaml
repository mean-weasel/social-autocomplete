          - docs/browser-acceptance/schemas/qa-oracle.schema.json
          - docs/browser-acceptance/oracles/chrome-all-channels-autocomplete.yaml
          - docs/browser-acceptance/oracles/chrome-authenticated-research.yaml
          - docs/browser-acceptance/oracles/in-app-public-research.yaml
          - docs/browser-acceptance/runbooks/qa-manager.md
          - docs/browser-acceptance/runbooks/qa-worker.md
          - docs/browser-acceptance/prompts/qa-manager-starter.md
          - docs/browser-acceptance/protocol/manager-worker.md
          - docs/browser-acceptance/README.md
          - tests/browser-acceptance/qa-config.test.mjs
          - tests/browser-acceptance/qa-manager-prompt.test.mjs
