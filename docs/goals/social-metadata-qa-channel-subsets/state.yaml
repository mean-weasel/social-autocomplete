      - "docs/goals/social-metadata-qa-channel-subsets/goal.md"
      - "The current qa-oracle/v1 contract and validator"
      - "The existing ignored Instagram, Facebook, LinkedIn QA scenario"
    constraints:
      - "Read-only."
      - "Do not implement."
      - "Preserve arbitrary nonempty ordered subsets and browser-specific availability."
      - "Reject any design that dynamically writes an oracle from user answers."
    expected_output:
      - "approved | needs_board_amendment"
      - "Final oracle migration decision"
      - "Exact product Worker objective and allowed_files"
      - "Focused and release verification commands"
      - "Adversarial failure modes for selected-only dispatch"
    receipt:
      result: done
      harness: codex
      decision: approved
      full_outcome_complete: false
      rationale: "PM fallback approves one breaking internal migration to qa-oracle/v2 because QA source pinning makes dual-version support unnecessary. Remove scenario identity coupling; capability applicability must declare browser, authentication state, scopes, modules, tiers, modes, and available channels. Oracle integrity still requires outcomes for every advertised channel, while a scenario may use any nonempty ordered subset. Exhaustive tests must call a pure, non-mutating compatibility check for all 13,699 Chrome and 15 in-app sequences, plus file-level schema negatives. The existing T002 scope is sufficient."
      worker_package:
        objective: "Implement qa-oracle/v2 capability profiles for Chrome and in-app research, subset-aware non-mutating compatibility validation, exhaustive ordered-subset and negative tests, and aligned manager/worker documentation without changing the stable CLI/JSON contract."
        allowed_files:
