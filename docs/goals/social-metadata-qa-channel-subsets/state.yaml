version: 2

goal:
  title: "Social Metadata QA Channel Subsets"
  slug: "social-metadata-qa-channel-subsets"
  kind: existing_plan
  tranche: "Implement and prove capability-oracle support for any valid ordered channel subset."
  status: done
  oracle:
    signal: "Exhaustive ordered-subset tests, clean release verification, exact QA source pinning, and selected-only manager/worker replay proof."
    cadence: "after the product Worker slice, after QA pinning, and at final audit"
    final_proof: "All 13,699 Chrome subsets and 15 in-app subsets pass compatibility coverage; release verification passes; the QA repository pins the exact product commit; and the saved three-channel scenario dispatches only Instagram, Facebook, and LinkedIn in order."
  intake:
    original_request: "Organize the approved channel-subset oracle fix as a GoalBuddy Prep board."
    interpreted_outcome: "Allow every fresh QA run to use any valid nonempty ordered channel subset without oracle-driven expansion."
    input_shape: existing_plan
    audience: "Codex QA users and social-metadata plugin maintainers"
    authority: approved
    proof_type: test
    completion_proof: "The full goal oracle passes and final audit records full_outcome_complete: true."
    likely_misfire: "Relaxing equality while still sorting, inheriting, dispatching, or recording channels the user did not select."
    blind_spots_considered:
      - "Browser-specific channel availability"
      - "Oracle migration and compatibility selection"
      - "Duplicate or empty selections"
      - "Scenario order versus oracle order"
      - "QA source commit and checksum pinning"
      - "Live authentication and UI-change interruptions"
    existing_plan_facts:
      - "Chrome supports any ordered subset of seven channels."
      - "The in-app browser supports any ordered subset of TikTok, YouTube, and Pinterest."
      - "Each selected channel appears at most once."
      - "The scenario is the sole authority for selected channel order."
      - "The oracle describes browser capabilities and allowed outcomes."
      - "The saved Instagram, Facebook, LinkedIn scenario must be reusable."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/social-metadata-qa-channel-subsets/"
    command: "node /Users/neonwatty/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.1/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/social-metadata-qa-channel-subsets"

