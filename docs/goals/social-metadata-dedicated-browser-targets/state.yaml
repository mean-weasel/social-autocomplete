      - "git -C /Users/neonwatty/Desktop/social-autocomplete-qa diff --check"
      - "git -C /Users/neonwatty/Desktop/social-autocomplete-qa status --short"
    stop_if:
      - "The source checkout is mutable or does not match the approved commit."
      - "QA packaging requires browser access."
      - "Private QA artifacts would be committed."
