schemaVersion: qa-oracle/v2
oracleId: chrome_authenticated_research_v2
protocolVersion: qa-manager-worker/v1
applicability:
  browser: chrome
  authenticationStates:
    - already_signed_in
  scopes:
    - setup
    - preflight
    - research
  modules:
    - hashtag
    - search-term
  evidenceTiers:
    - autocomplete_only
    - results_sample
  modes:
    - guided
    - automatic
  availableChannels:
    - facebook
    - instagram
    - linkedin
    - x
    - tiktok
    - youtube
    - pinterest
startupRequestOrder:
  - browser_selection
  - ordered_channel_selection
  - plan_confirmation
invariants:
  exactlyOneTopLevelOrchestrator: true
  linkedPlaybooks:
    - facebook
    - instagram
    - linkedin
    - x
    - tiktok
    - youtube
    - pinterest
  noPlanBeforeBrowserAndChannels: true
  newRunInheritance: false
  answerSource: qa_scenario
  credentialHandling: false
  temporaryBrowser: false
  publishing: false
  dedicatedTargetOwnership: plugin_owned
  userTabAccess: false
  rawTargetPersistence: false
  releaseBeforeCompletion: true
channelOutcomes:
  facebook: &authenticated_outcomes
    - ready
    - authentication_required
    - challenge
    - locale_mismatch
    - ui_change
  instagram: *authenticated_outcomes
  linkedin: *authenticated_outcomes
  x: *authenticated_outcomes
  tiktok: *authenticated_outcomes
  youtube: *authenticated_outcomes
  pinterest:
    - ready
    - authentication_required
    - challenge
    - locale_mismatch
    - ui_change
    - not_applicable
terminalInterruptions:
  - authentication_required
  - challenge
  - unsafe_request
  - unexpected_request
  - oracle_contradiction
