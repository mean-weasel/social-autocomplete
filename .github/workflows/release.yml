name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Match tag to synchronized plugin version
        run: npm run version:check -- "${GITHUB_REF_NAME#v}"
      - run: npm run verify:ci
      - name: Pack plugin and checksum
        run: |
          mkdir dist-release
          npm pack --pack-destination dist-release
          cd dist-release
          sha256sum ./*.tgz > SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            dist-release/*.tgz dist-release/SHA256SUMS \
            --verify-tag --generate-notes "${prerelease[@]}"
