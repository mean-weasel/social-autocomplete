name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [codex/qa-automation-pivot]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:repo
      - run: npm run typecheck
      - run: npm run build
      - name: Verify committed runtime is current
        run: git diff --exit-code -- bin/runtime
      - name: Lint durable Markdown
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            AGENTS.md
            README.md
            skills/**/*.md
            docs/browser-acceptance/**/*.md
            docs/integration/**/*.md
            docs/feature-task-template.md
            docs/releasing.md

  offline:
    name: Offline test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:offline
      - run: npm run test:diagnostics
      - run: npm run test:browser-harness
      - run: npm run test:subprocess-consumer

  package:
    name: Packed plugin smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ci-contract
      - run: npm run test:package

  required:
    name: Required
    if: always()
    needs: [repository, offline, package]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI job
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = "success,success,success"
